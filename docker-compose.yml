services:
  db:
    build:
      context: .
      args:
        PG_TAG: "${PG_TAG:-18.6}"
        TT_MAX_KEYS: "${TT_MAX_KEYS:-4}"
    container_name: ttree-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bd2
    ports:
      - "5432:5432"
    volumes:
      # PG 18+: la imagen guarda los datos en /var/lib/postgresql/18/docker,
      # por eso el volumen se monta en /var/lib/postgresql (no en .../data)
      - pgdata:/var/lib/postgresql
      - ./tests:/tests:ro
      - ./sql/demo:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd2"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
